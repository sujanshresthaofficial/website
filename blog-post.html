<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Sujan Shrestha</title>
    <meta name="description" content="Read articles and poetry by Sujan Shrestha.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="author" content="Sujan Shrestha">
    <link rel="canonical" href="https://ssujan.com.np/blog-post.html">
    <link rel="icon" href="assets/newLogo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .blog-reader {
            max-width: 900px;
            margin: 0 auto;
            padding: 42px 24px 90px;
            text-align: justify;
        }

        .reader-top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .blog-back {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .reader-share {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 999px;
            padding: 9px 16px;
            cursor: pointer;
        }

        .reader-header {
            max-width: 760px;
            margin: 0 auto 28px;
        }

        .reader-category {
            color: var(--accent-blue);
            font-size: .8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .reader-header h1 {
            font-size: clamp(2rem, 5vw, 3.35rem);
            line-height: 1.16;
            letter-spacing: -.035em;
            margin: 14px 0 20px;
        }

        .reader-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            opacity: .65;
            font-size: .9rem;
        }

        .reader-cover {
            display: block;
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            border-radius: 20px;
            margin: 32px 0 42px;
        }

        .reader-content {
            max-width: 760px;
            margin: 0 auto;
            font-size: 1.08rem;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .reader-content p {
            margin: 0 0 1.35em;
        }

        .reader-content h2,
        .reader-content h3,
        .reader-content h4 {
            line-height: 1.4;
            margin: 2.2em 0 .8em;
        }

        .reader-content h2:first-child,
        .reader-content h4:first-child {
            margin-top: 0;
        }

        .reader-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .reader-content blockquote {
            border-left: 3px solid var(--accent-blue);
            padding-left: 18px;
            opacity: .85;
        }

        .reader-footer {
            max-width: 760px;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            margin: 50px auto 0;
        }

        .blog-not-found {
            text-align: center;
            padding: 70px 20px;
        }

        .blog-not-found h1 {
            font-size: 2.2rem;
        }

        /* Nepali poem illustration layout */
        .chari-poem-container {
            display: flex;
            flex-direction: column;
            gap: 45px;
            padding: 10px 0;
            align-items: center;
        }

        .chari-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 250px;
        }

        .chari-text {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.9;
            color: var(--text-color);
        }

        .chari-img {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chari-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .img-size-sm {
            width: 110px;
            height: 110px;
        }

        .img-size-md {
            width: 130px;
            height: 130px;
        }

        .img-size-lg {
            width: 150px;
            height: 170px;
        }

        .img-size-md-horizontal {
            width: 160px;
            height: 100px;
        }

        .img-size-lg-vertical {
            width: 140px;
            height: 180px;
        }

        @media(max-width:768px) {
            .reader-top-actions {
                margin-top: 30px;
            }

            .blog-reader {
                padding: 28px 17px 65px;
            }

            .reader-content {
                font-size: 1rem;
            }

            .chari-row,
            .chari-row.layout-right-img,
            .chari-row.layout-left-img {
                flex-direction: column !important;
                text-align: justify;
                gap: 15px;
                border-bottom: 1px dashed var(--border-color);
                padding-bottom: 25px;
            }

            .chari-row:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }

            .chari-text {
                order: 1;
            }

            .chari-img {
                order: 2;
                max-width: 150px;
                height: auto;
            }
        }
    </style>
</head>

<body>
    <script>try { if (localStorage.getItem('theme') === 'dark-mode') document.body.classList.add('dark-mode'); } catch (e) { }</script>
    <div class="wrapper">
        <div id="header-placeholder"></div>
        <main class="blog-reader">
            <article id="blogArticle">
                <p>Loading article...</p>
            </article>
        </main>
        <div id="footer-placeholder"></div>
    </div>
    <script src="javascript.js"></script>
    <script src="blog-posts.js"></script>
</body>

</html>
